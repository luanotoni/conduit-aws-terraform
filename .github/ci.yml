name: CI

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write   # needed to assume the AWS role via OIDC (for terraform plan)
  contents: read
  pull-requests: write # needed to comment the plan on the PR

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  test:
    name: Lint & test Django app
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: conduit
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduit_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conduit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 conduit --max-line-length=100 --exclude=migrations
        continue-on-error: true # style issues shouldn't block a portfolio-stage pipeline; flip this off once the codebase is clean

      - name: Run tests
        env:
          DJANGO_DEBUG: "true"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
          DJANGO_SECRET_KEY: "ci-only-secret-key"
          POSTGRES_DB: conduit
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduit_ci_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
        run: python manage.py test

  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/environments/prod

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive ../../

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: |
          terraform plan -no-color -input=false -var="alert_email=${{ vars.ALERT_EMAIL }}" \
            -out=tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/environments/prod/plan_output.txt', 'utf8').slice(-60000);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terraform Plan\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`
            });

      - name: Fail job if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
